<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<meta http-equiv="refresh" content="0; url=https://figma.com" />
<link rel="canonical" href="https://figma.com" />
<title>Figma</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a0a; color: #fff; min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .card { max-width: 320px; }
  h1 { font-size: 24px; font-weight: 500; margin-bottom: 8px; }
  p { font-size: 13px; opacity: 0.55; line-height: 1.5; margin-bottom: 16px; }
  a {
    display: inline-block;
    padding: 10px 18px;
    background: #fff; color: #0a0a0a;
    border-radius: 999px;
    text-decoration: none;
    font-size: 12px; font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Figma</h1>
    <p>Design files, in your pocket</p>
    <a href="https://figma.com">Open</a>
  </div>
  <script>setTimeout(() => location.replace("https://figma.com"), 50);</script>
</body>
</html>
